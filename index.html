<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Workshop Digitalisasi Pembelajaran</title>
  <meta name="description" content="LMS Workshop Digitalisasi Pembelajaran untuk Guru dan Tenaga Kependidikan. Pelajari Bahan Ajar Interaktif, Media Pembelajaran, dan Asesmen Digital.">
  <meta name="theme-color" content="#F9F3E5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F9F3E5'/><text x='50' y='62' text-anchor='middle' font-size='50'>📚</text></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DigiLearn">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen" style="position:fixed;inset:0;background:#F9F3E5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
    <div style="font-size:64px;margin-bottom:16px">📚</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#1A1A1A">Memuat...</div>
  </div>

  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="sticker-overlay" class="sticker-overlay hidden"></div>

  <!-- App scripts (no external SDK needed! 🎉) -->
  <script src="js/data.js"></script>
  <script src="js/sheets-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <script>
    (async function() {
      try {
        await DB.init();
      } catch(e) {
        console.warn('DB init:', e);
      }
      document.getElementById('loading-screen').style.display = 'none';
      Router.init();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
